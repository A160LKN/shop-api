# Blueprint для Render: Dashboard → New → Blueprint → выбрать этот репозиторий.
# База — внешняя (Neon): бесплатная база Render удаляется через 30 дней.
services:
  - type: web
    name: shop-api
    runtime: docker
    plan: free
    region: frankfurt
    dockerCommand: sh scripts/start-render.sh
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: DATABASE_URL
        sync: false            # адрес базы из Neon — вставить при создании
      - key: CORS_ORIGINS
        sync: false            # адрес фронтенда на Vercel, например https://shop-web.vercel.app
      # Живой сайт: секреты по умолчанию запрещены, без JWT_SECRET сервер не стартует
      - key: ENVIRONMENT
        value: production
      - key: JWT_SECRET
        generateValue: true    # Render сам создаст длинный случайный секрет
      # Пароль администратора демо опубликован в README: каждый старт сервера возвращает
      # каталог и промокоды к исходному виду (app/seed.py:reset_demo)
      - key: DEMO_RESET
        value: "true"
      - key: PAYMENT_GATEWAY_URL
        value: http://127.0.0.1:8001
      # Бесплатный сервер маленький (512 МБ, один процесс) — пул соединений поменьше
      - key: WEB_CONCURRENCY
        value: "1"
      # Адрес клиента для лимитов входа и регистрации (см. app/ratelimit.py:client_ip).
      # Render стоит за Cloudflare: True-Client-IP выставляет Cloudflare, X-Forwarded-For — «…, клиент, Cloudflare»
      - key: CLIENT_IP_HEADER
        value: true-client-ip
      - key: TRUST_PROXY
        value: "true"
      - key: PROXY_HOPS
        value: "2"
      - key: DB_POOL_SIZE
        value: "5"
      - key: DB_MAX_OVERFLOW
        value: "5"
