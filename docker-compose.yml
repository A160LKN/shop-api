services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"   # чтобы тесты с компьютера могли подключиться к этой же БД
    volumes:
      - ./scripts/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U shop"]
      interval: 2s
      timeout: 3s
      retries: 20

  payments:
    build: .
    command: uvicorn tools.fake_gateway:app --host 0.0.0.0 --port 8001
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8001/docs')"]
      interval: 2s
      timeout: 3s
      retries: 20

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://shop:shop@db:5432/shop
      PAYMENT_GATEWAY_URL: http://payments:8001
      JWT_SECRET: local-docker-secret-at-least-32-bytes
      # Два процесса сервера — по числу ядер. У каждого свой пул соединений с БД (до 40),
      # поэтому 2 × 40 = 80 — укладывается в лимит PostgreSQL в 100 соединений
      WEB_CONCURRENCY: 2
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      payments:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 2s
      timeout: 3s
      retries: 30
