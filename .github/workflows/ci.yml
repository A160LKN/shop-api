name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  lint:
    name: Линтер (ruff)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ruff pip-audit
      - run: ruff check .
      - name: Уязвимости в зависимостях (pip-audit)
        run: pip-audit -r requirements.txt

  tests:
    name: Тесты (unit, integration, API)
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/shop_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt
      - run: pip install -r requirements-dev.txt

      - name: Юнит-тесты — без БД
        run: pytest -m unit --cov --cov-report= --alluredir=allure-results
      - name: Интеграционные и API-тесты — на PostgreSQL
        run: >-
          pytest -m "integration or api"
          --cov --cov-append --cov-report=term --cov-report=html --cov-fail-under=90
          --junitxml=test-results.xml --alluredir=allure-results

      - name: Сохранить отчёт о покрытии
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: htmlcov/
          retention-days: 14

      - name: Собрать Allure-отчёт и положить рядом отчёт о покрытии
        if: always()
        run: |
          npx --yes allure-commandline@2 generate allure-results --clean -o site
          cp -r htmlcov site/coverage || true
      - name: Подготовить отчёты к публикации на GitHub Pages
        if: always() && github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v5
        with:
          path: site

  report:
    name: Опубликовать отчёты на GitHub Pages
    needs: tests
    if: always() && github.ref == 'refs/heads/main' && needs.tests.result != 'skipped'
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v5

  docker:
    name: Docker-образ, смоук- и нагрузочный тест
    needs: tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: Собрать и запустить приложение, БД и шлюз
        run: docker compose up --build --detach --wait
      - name: Смоук-тест
        run: ./scripts/smoke.sh
      - name: Установить k6
        uses: grafana/setup-k6-action@v1
        with:
          k6-version: "1.4.2"
      - name: Нагрузочный тест — 30 пользователей, пороги по времени ответа и ошибкам
        run: k6 run -e SUMMARY_FILE=loadtest-summary.md loadtest/shop.js
      - name: Отчёт о нагрузке на странице запуска
        if: always()
        run: cat loadtest-summary.md >> "$GITHUB_STEP_SUMMARY" || true
      - name: Логи приложения при падении
        if: failure()
        run: docker compose logs api payments
      - name: Остановить
        if: always()
        run: docker compose down --volumes

  zap:
    name: Безопасность — OWASP ZAP по API
    needs: lint
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: shop
          POSTGRES_PASSWORD: shop
          POSTGRES_DB: shop
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U shop"
          --health-interval 2s --health-timeout 3s --health-retries 20
    env:
      DATABASE_URL: postgresql+psycopg://shop:shop@localhost:5432/shop
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: pip install -r requirements.txt
      - name: Запустить API
        run: |
          alembic upgrade head && python -m app.seed
          nohup uvicorn app.main:app --host 0.0.0.0 --port 8000 > /tmp/api.log 2>&1 &
          for i in $(seq 1 30); do curl -sf http://localhost:8000/health && break; sleep 1; done
      - name: ZAP API scan по OpenAPI-схеме
        run: |
          # Контейнер ZAP работает не от root: ему нужна своя папка с правом записи для отчёта
          mkdir -p zap && cp zap-rules.tsv zap/ && chmod -R a+rwx zap
          docker run --network host -v "$PWD/zap:/zap/wrk:rw" -t ghcr.io/zaproxy/zaproxy:stable \
            zap-api-scan.py -t http://localhost:8000/openapi.json -f openapi \
            -c zap-rules.tsv -r zap-report.html -I
      - name: Сохранить отчёт ZAP
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: zap-report
          path: zap/zap-report.html
          retention-days: 14
